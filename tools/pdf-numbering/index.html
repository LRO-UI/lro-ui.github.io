<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PDF page numbers</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='7' width='18' height='18' transform='rotate(45 16 16)' fill='%233f6fa8' stroke='%23e7eaf0' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:wght@400..900&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    color-scheme:dark;
    --bg:#0d0f14; --panel:#14171f; --panel-edge:#232732;
    --blue:#3f6fa8; --blue2:#5c7f9e; --steel:#7c8698;
    --ink:#e7eaf0; --ink-soft:#727c8c; --line:#252a35;
    --danger:#c77a7a; --ok:#7fa88a; --warn:#c9a86a;
    --font-ui:'Space Grotesk', system-ui, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
    --face-sans:Helvetica, Arial, sans-serif;
    --face-serif:'Times New Roman', Times, serif;
    --face-mono:'Courier New', Courier, monospace;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); display:flex; flex-direction:column;
  }
  header{
    padding:22px 30px; border-bottom:4px double var(--blue2);
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  }
  header h1{
    margin:0; font-family:'Playfair Display', Georgia, serif; font-weight:800;
    font-size:1.5rem; letter-spacing:.02em; color:var(--ink);
  }
  .app{display:flex; flex:1; flex-wrap:wrap;}

  /* Stage */
  .stage{
    flex:3 1 480px; min-width:0; position:relative;
    padding:40px; display:flex; align-items:stretch;
    border-right:1px solid var(--line);
  }
  .rail-frame{ position:relative; flex:1; display:flex; min-height:420px; min-width:0; }
  .rail-frame::before, .rail-frame::after{
    content:''; position:absolute; pointer-events:none; z-index:2;
  }
  .rail-frame::before{ inset:8px; border:1px solid rgba(231,234,240,.6); }
  .rail-frame::after{ inset:13px; border:1px solid rgba(92,127,158,.35); }
  .rail-d{
    position:absolute; width:10px; height:10px; z-index:3;
    background:var(--blue); border:2px solid var(--bg);
    transform:translate(-50%,-50%) rotate(45deg);
    box-shadow:0 0 0 1px rgba(231,234,240,.5);
  }
  .rail-d.tl{top:8px; left:8px;} .rail-d.tr{top:8px; left:calc(100% - 8px);}
  .rail-d.bl{top:calc(100% - 8px); left:8px;} .rail-d.br{top:calc(100% - 8px); left:calc(100% - 8px);}

  .preview{
    flex:1; margin:34px; display:flex; flex-direction:column;
    justify-content:center; gap:16px; min-width:0; position:relative; z-index:4;
  }

  /* Empty state: drop zone */
  .drop{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; text-align:center; padding:30px; min-height:280px;
    border:1px dashed rgba(92,127,158,.5);
  }
  .stage.over .drop{ border-color:var(--ink); background:rgba(63,111,168,.12); }
  .drop p{ margin:0; }
  .drop .lead{ font-size:1rem; color:var(--ink); }
  .drop .note{ font-size:.72rem; color:var(--ink-soft); line-height:1.5; max-width:34ch; }
  .drop .error{ font-size:.8rem; color:var(--danger); line-height:1.5; max-width:40ch; }
  .drop button.tool{ padding:12px 22px; }

  /* Loaded state */
  .meta{ display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
  .meta .name{ font-size:.8rem; color:var(--ink); overflow-wrap:anywhere; min-width:0; }
  .meta .dims{ font-size:.72rem; color:var(--blue2); font-variant-numeric:tabular-nums; letter-spacing:.06em; }

  .sheet-wrap{ display:flex; justify-content:center; min-width:0; }
  .sheet{
    position:relative; background:#fff; flex:none;
    box-shadow:0 0 0 1px var(--panel-edge);
  }
  .sheet canvas, .sheet svg{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .sheet svg text{ fill:#000; }
  .sheet svg path{ fill:none; stroke:var(--blue); stroke-width:1.5; vector-effect:non-scaling-stroke; }

  .pager{ display:flex; align-items:center; justify-content:center; gap:14px; }
  .pager .where{ font-size:.72rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; letter-spacing:.06em; min-width:11ch; text-align:center; }
  button.ghost{
    background:transparent; border:1px solid var(--line); color:var(--ink-soft);
    font-family:var(--font-ui); font-size:.68rem; letter-spacing:.08em;
    padding:7px 12px; cursor:pointer; min-width:78px;
  }
  button.ghost:hover{ color:var(--ink); border-color:var(--blue2); }
  button.ghost:focus-visible{ outline:1px solid #fff; outline-offset:2px; }
  button.ghost:disabled{ opacity:.35; cursor:not-allowed; }
  .caption{ font-size:.7rem; color:var(--ink-soft); line-height:1.45; text-align:center; margin:0; }

  /* Side panel */
  .side{
    flex:1 1 320px; min-width:0; padding:30px 28px;
    display:flex; flex-direction:column; gap:26px; overflow:auto;
  }
  .group-title{
    display:flex; align-items:center; gap:10px;
    text-transform:uppercase; letter-spacing:.26em; font-size:.66rem;
    color:var(--ink-soft); margin-bottom:12px;
  }
  .group-title::before{ content:''; width:6px; height:6px; background:var(--blue); transform:rotate(45deg); flex:none; }
  .group-title::after{ content:''; flex:1; height:3px; border-top:1px solid var(--blue); border-bottom:1px solid var(--blue2); }

  .row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; font-size:.8rem; gap:10px; }
  .row .val{ color:var(--blue2); font-size:.72rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
  input[type=range]{
    width:100%; -webkit-appearance:none; appearance:none; height:2px; background:var(--line); outline:none; margin:10px 0;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; background:var(--blue);
    border:2px solid var(--bg); box-shadow:0 0 0 1px var(--blue2); transform:rotate(45deg); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:11px; height:11px; background:var(--blue); border:2px solid var(--bg);
    box-shadow:0 0 0 1px var(--blue2); transform:rotate(45deg); cursor:pointer; border-radius:0;
  }
  input[type=range]:focus-visible::-webkit-slider-thumb{ box-shadow:0 0 0 2px #fff; }
  input[type=range]:focus-visible::-moz-range-thumb{ box-shadow:0 0 0 2px #fff; }
  .scale{ display:flex; justify-content:space-between; font-size:.66rem; color:#4d5563; font-variant-numeric:tabular-nums; }

  .btn-grid{ display:grid; gap:8px; }
  .btn-grid.three{ grid-template-columns:repeat(3,1fr); }
  .btn-grid.two{ grid-template-columns:repeat(2,1fr); }
  button.tool{
    --c:var(--blue2);
    border:1px solid var(--line); background:
      linear-gradient(var(--c),var(--c)) top left/8px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) top left/1px 8px no-repeat,
      linear-gradient(var(--c),var(--c)) top right/8px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) top right/1px 8px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left/8px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left/1px 8px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right/8px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right/1px 8px no-repeat,
      var(--panel);
    box-shadow:inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--panel-edge);
    color:var(--ink); font-family:var(--font-ui); font-size:.85rem; font-variant-numeric:tabular-nums;
    letter-spacing:.06em; padding:12px 8px; cursor:pointer; min-width:0;
  }
  button.tool:hover{ --c:#fff; }
  button.tool:focus-visible{ outline:1px solid #fff; outline-offset:2px; }
  button.tool.active{ --c:var(--blue); background-color:rgba(63,111,168,.18); color:#fff; }
  button.tool .big{ display:block; font-size:1.05rem; letter-spacing:.02em; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  button.tool .small{ display:block; margin-top:5px; font-family:var(--font-ui); font-size:.62rem; letter-spacing:.1em; color:var(--ink-soft); }
  button.tool.active .small{ color:var(--ink); }
  .face-sans{ font-family:var(--face-sans); }
  .face-serif{ font-family:var(--face-serif); }
  .face-mono{ font-family:var(--face-mono); }

  /* Position picker: a small page with six anchor points */
  .pos{ display:grid; grid-template-columns:auto 1fr; gap:20px; align-items:center; }
  /* Fixed slot, so the controls below don't move when the page shape changes */
  .pos-slot{ width:104px; height:148px; display:flex; align-items:center; }
  .pos-page{
    position:relative; width:104px; aspect-ratio:210/297;
    background:var(--panel); border:1px solid var(--panel-edge);
  }
  .pos-page::before{
    content:''; position:absolute; inset:34px 22px; pointer-events:none;
    background:repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 8px);
  }
  .pos-page button{
    position:absolute; width:30px; height:30px; padding:0; border:0; background:none; cursor:pointer;
  }
  .pos-page button::before{
    content:''; position:absolute; left:50%; top:50%; width:8px; height:8px;
    transform:translate(-50%,-50%) rotate(45deg);
    background:var(--panel); border:1px solid var(--steel);
  }
  .pos-page button:hover::before{ border-color:#fff; }
  .pos-page button.active::before{
    width:10px; height:10px; background:var(--blue); border-color:var(--ink);
  }
  .pos-page button:focus-visible{ outline:1px solid #fff; outline-offset:-5px; }
  .pos-page [data-pos^="t"]{ top:0; } .pos-page [data-pos^="b"]{ bottom:0; }
  .pos-page [data-pos$="l"]{ left:0; } .pos-page [data-pos$="r"]{ right:0; }
  .pos-page [data-pos$="c"]{ left:calc(50% - 15px); }
  .pos-side{ min-width:0; }
  .pos-name{ font-size:.95rem; color:var(--ink); margin-bottom:16px; }

  button.primary{
    width:100%; background:var(--blue); border:1px solid var(--blue2); color:#fff;
    font-family:var(--font-ui); font-size:.72rem; text-transform:uppercase; letter-spacing:.22em;
    padding:14px 10px; cursor:pointer;
    box-shadow:inset 0 0 0 3px var(--blue), inset 0 0 0 4px rgba(231,234,240,.35);
  }
  button.primary:hover{ background:#4a7cb8; }
  button.primary:focus-visible{ outline:1px solid #fff; outline-offset:2px; }
  button.primary:disabled{ opacity:.4; cursor:not-allowed; }
  button.secondary{
    width:100%; margin-top:8px; background:transparent; border:1px solid var(--line);
    color:var(--ink-soft); font-family:var(--font-ui); font-size:.68rem; text-transform:uppercase;
    letter-spacing:.2em; padding:11px 10px; cursor:pointer;
  }
  button.secondary:hover{ color:var(--ink); border-color:var(--blue2); }
  button.secondary:focus-visible{ outline:1px solid #fff; outline-offset:2px; }
  .status{ font-size:.7rem; color:var(--ink-soft); margin-top:8px; min-height:1em; line-height:1.45; overflow-wrap:anywhere; }
  .status.bad{ color:var(--danger); }
  .status.good{ color:var(--ok); }

  @media (max-width:760px){
    .stage{ border-right:none; border-bottom:1px solid var(--line); padding:18px; flex-basis:100%; }
    .rail-frame{ min-height:0; }
    .preview{ margin:30px 24px; }
    .drop{ min-height:220px; }
    header{ padding:18px 20px; }
    .side{ padding:24px 20px; flex-basis:100%; }
  }
</style>
</head>
<body>
<header>
  <h1>PDF page numbers</h1>
</header>

<div class="app">
  <div class="stage" id="stage">
    <div class="rail-frame">
      <div class="rail-d tl"></div><div class="rail-d tr"></div>
      <div class="rail-d bl"></div><div class="rail-d br"></div>

      <div class="preview">
        <div class="drop" id="drop">
          <p class="lead" id="dropLead">Drop a PDF here</p>
          <button class="tool" id="btnChoose" type="button">Choose a PDF</button>
          <p class="note">The file stays on this device. Nothing is uploaded.</p>
          <p class="error" id="dropError" role="alert" hidden></p>
        </div>

        <div class="meta" id="meta" hidden>
          <div class="name" id="fileName"></div>
          <div class="dims" id="dims"></div>
        </div>
        <div class="sheet-wrap" id="sheetWrap" hidden>
          <div class="sheet" id="sheet">
            <canvas id="canvas" aria-hidden="true"></canvas>
            <svg id="overlay" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Where the page number will sit">
              <path id="marks" d=""/>
              <text id="num"></text>
            </svg>
          </div>
        </div>
        <div class="pager" id="pager" hidden>
          <button class="ghost" id="btnPrev" type="button">Previous</button>
          <span class="where" id="where" aria-live="polite"></span>
          <button class="ghost" id="btnNext" type="button">Next</button>
        </div>
        <p class="caption" id="caption" hidden>Blue brackets mark the number in this preview. They aren't added to the file.</p>
      </div>
    </div>
  </div>

  <div class="side">
    <div>
      <div class="group-title">Typeface</div>
      <div class="btn-grid three" id="fontGrid">
        <button class="tool active" type="button" data-val="sans" aria-pressed="true"><span class="big face-sans">Sans</span><span class="small">Helvetica</span></button>
        <button class="tool" type="button" data-val="serif" aria-pressed="false"><span class="big face-serif">Serif</span><span class="small">Times</span></button>
        <button class="tool" type="button" data-val="mono" aria-pressed="false"><span class="big face-mono">Mono</span><span class="small">Courier</span></button>
      </div>
    </div>

    <div>
      <div class="group-title">Size</div>
      <div class="row"><label for="sizeRange">Number size</label><span class="val" id="sizeVal">11 pt</span></div>
      <input type="range" id="sizeRange" min="6" max="36" step="1" value="11">
      <div class="scale"><span>6</span><span>36</span></div>
    </div>

    <div>
      <div class="group-title">Position</div>
      <div class="pos">
        <div class="pos-slot"><div class="pos-page" id="posPage" role="group" aria-label="Position on the page">
          <button type="button" data-pos="tl" aria-label="Top left" aria-pressed="false"></button>
          <button type="button" data-pos="tc" aria-label="Top center" aria-pressed="false"></button>
          <button type="button" data-pos="tr" aria-label="Top right" aria-pressed="false"></button>
          <button type="button" data-pos="bl" aria-label="Bottom left" aria-pressed="false"></button>
          <button type="button" data-pos="bc" aria-label="Bottom center" aria-pressed="false"></button>
          <button type="button" data-pos="br" aria-label="Bottom right" aria-pressed="true" class="active"></button>
        </div></div>
        <div class="pos-side">
          <div class="pos-name" id="posName" aria-live="polite">Bottom right</div>
          <div class="row"><label for="marginRange">Distance from edge</label><span class="val" id="marginVal">10 mm</span></div>
          <input type="range" id="marginRange" min="4" max="30" step="1" value="10">
          <div class="scale"><span>4</span><span>30</span></div>
        </div>
      </div>
    </div>

    <div>
      <div class="group-title">Format</div>
      <div class="btn-grid two" id="formatGrid">
        <button class="tool active" type="button" data-val="page" aria-pressed="true"><span class="big face-sans" id="sampleA">1</span><span class="small">Page only</span></button>
        <button class="tool" type="button" data-val="total" aria-pressed="false"><span class="big face-sans" id="sampleB">1/12</span><span class="small">Page / total</span></button>
      </div>
    </div>

    <div>
      <div class="group-title">Download</div>
      <button class="primary" id="btnDownload" type="button" disabled>Download numbered PDF</button>
      <button class="secondary" id="btnAnother" type="button" hidden>Choose another PDF</button>
      <div class="status" id="status" aria-live="polite">Choose a PDF to start.</div>
    </div>
  </div>
</div>

<input type="file" id="file" accept="application/pdf,.pdf" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const PT_PER_MM = 72 / 25.4;

  /* digit = height of a numeral as a share of the font size, used to keep
     the top margin visually equal to the bottom one */
  const FACES = {
    sans:  { cls:'face-sans',  css:"Helvetica, Arial, sans-serif",          std:'Helvetica',  digit:.71 },
    serif: { cls:'face-serif', css:"'Times New Roman', Times, serif",       std:'TimesRoman', digit:.676 },
    mono:  { cls:'face-mono',  css:"'Courier New', Courier, monospace",     std:'Courier',    digit:.62 }
  };
  const POS_NAMES = { tl:'Top left', tc:'Top center', tr:'Top right', bl:'Bottom left', bc:'Bottom center', br:'Bottom right' };

  const state = { face:'sans', size:11, pos:'br', margin:10, format:'page', page:1 };
  const file = { name:'', bytes:null, geoms:[], view:null };
  let renderToken = 0, renderTask = null, lastCssW = 0;

  /* The save capability exists only inside a published Claude page.
     Anywhere else the page falls back to a normal browser download. */
  const downloadsReady = (window.claude && typeof window.claude.use === 'function')
    ? Promise.resolve(window.claude.use('downloads')).catch(() => null)
    : Promise.resolve(null);

  const pdfjs = window.pdfjsLib || null;
  if(pdfjs){
    pdfjs.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  function label(n, total){ return state.format === 'total' ? n + '/' + total : String(n); }

  function setStatus(text, kind){
    const el = $('status');
    el.textContent = text;
    el.className = 'status' + (kind ? ' ' + kind : '');
  }

  /* Visible size of a page, accounting for its rotation flag */
  function geomOf(page){
    let rot = Math.round(page.getRotation().angle / 90) * 90;
    rot = ((rot % 360) + 360) % 360;
    const box = page.getCropBox();
    const swap = rot % 180 !== 0;
    return { rot, box, W: swap ? box.height : box.width, H: swap ? box.width : box.height };
  }

  /* ---------- Loading ---------- */
  function showDropError(msg){
    $('dropLead').textContent = 'Drop a PDF here';
    const e = $('dropError');
    e.textContent = msg; e.hidden = !msg;
  }

  function setLoaded(on){
    $('drop').hidden = on;
    ['meta','sheetWrap','caption'].forEach(id => $(id).hidden = !on);
    $('pager').hidden = !on || file.geoms.length < 2;
    $('btnAnother').hidden = !on;
    $('btnDownload').disabled = !on;
  }

  async function loadFile(f){
    if(!f) return;
    const looksPdf = f.type === 'application/pdf' || /\.pdf$/i.test(f.name);
    const wasLoaded = !!file.bytes;
    const fail = msg => {
      if(wasLoaded){ setStatus(msg, 'bad'); }
      else { showDropError(msg); }
    };
    if(!looksPdf){ fail('"' + f.name + '" is not a PDF. Choose a file that ends in .pdf.'); return; }
    if(!window.PDFLib){ fail('The PDF library did not load. Check your connection and reload the page.'); return; }

    if(wasLoaded) setStatus('Reading ' + f.name + '…');
    else { $('dropError').hidden = true; $('dropLead').textContent = 'Reading ' + f.name + '…'; }
    await new Promise(r => setTimeout(r, 30));

    let bytes, geoms;
    try{
      bytes = new Uint8Array(await f.arrayBuffer());
      const doc = await PDFLib.PDFDocument.load(bytes);
      geoms = doc.getPages().map(geomOf);
      if(!geoms.length) throw new Error('empty');
    }catch(err){
      const m = String(err && err.message || err);
      fail(/encrypt/i.test(m)
        ? 'This PDF is password-protected, so it can\'t be edited. Remove the password and try again.'
        : 'This file could not be read as a PDF. It may be damaged. Try another file.');
      return;
    }

    if(file.view){ try{ file.view.destroy(); }catch(_){ } }
    file.name = f.name; file.bytes = bytes; file.geoms = geoms; file.view = null;
    state.page = 1; lastCssW = 0;
    $('dropLead').textContent = 'Drop a PDF here';

    let previewNote = '';
    if(pdfjs){
      try{ file.view = await pdfjs.getDocument({ data: bytes.slice() }).promise; }
      catch(_){ file.view = null; }
    }
    if(!file.view) previewNote = ' The page content can\'t be shown here, but the numbers will still be added.';

    $('fileName').textContent = f.name;
    setLoaded(true);
    setStatus('Ready to number ' + geoms.length + (geoms.length === 1 ? ' page.' : ' pages.') + previewNote);
    refresh(true);
  }

  /* ---------- Preview ---------- */
  function layout(){
    const g = file.geoms[state.page - 1]; if(!g) return 0;
    const wrap = $('sheetWrap');
    const availW = wrap.clientWidth;
    const maxH = Math.max(320, Math.min(820, window.innerHeight - 340));
    const k = Math.min(availW / g.W, maxH / g.H);
    const w = Math.max(1, Math.floor(g.W * k)), h = Math.max(1, Math.floor(g.H * k));
    const sheet = $('sheet');
    sheet.style.width = w + 'px'; sheet.style.height = h + 'px';
    return w;
  }

  function drawOverlay(){
    const g = file.geoms[state.page - 1]; if(!g) return;
    const face = FACES[state.face];
    const m = state.margin * PT_PER_MM;
    const row = state.pos[0], col = state.pos[1];
    const svg = $('overlay'), txt = $('num');

    svg.setAttribute('viewBox', '0 0 ' + g.W + ' ' + g.H);
    txt.textContent = label(state.page, file.geoms.length);
    txt.setAttribute('font-size', state.size);
    txt.style.fontFamily = face.css;
    txt.setAttribute('text-anchor', col === 'l' ? 'start' : col === 'r' ? 'end' : 'middle');
    const x = col === 'l' ? m : col === 'r' ? g.W - m : g.W / 2;
    const base = row === 'b' ? g.H - m : m + face.digit * state.size;
    txt.setAttribute('x', x); txt.setAttribute('y', base);

    /* Corner brackets around the number, kept a constant size on screen */
    const tw = txt.getComputedTextLength();
    const perPx = g.W / Math.max(1, $('sheet').clientWidth);
    const pad = 5 * perPx, arm = 6 * perPx;
    const x0 = (col === 'l' ? x : col === 'r' ? x - tw : x - tw / 2) - pad;
    const x1 = x0 + tw + pad * 2;
    const y0 = base - face.digit * state.size - pad, y1 = base + pad;
    $('marks').setAttribute('d',
      'M' + x0 + ' ' + (y0 + arm) + 'V' + y0 + 'H' + (x0 + arm) +
      'M' + (x1 - arm) + ' ' + y0 + 'H' + x1 + 'V' + (y0 + arm) +
      'M' + x1 + ' ' + (y1 - arm) + 'V' + y1 + 'H' + (x1 - arm) +
      'M' + (x0 + arm) + ' ' + y1 + 'H' + x0 + 'V' + (y1 - arm));
  }

  async function renderPage(cssW){
    const token = ++renderToken;
    const canvas = $('canvas');
    if(!file.view){ canvas.width = canvas.height = 1; return; }
    try{
      const page = await file.view.getPage(state.page);
      if(token !== renderToken) return;
      const base = page.getViewport({ scale:1 });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: Math.min(cssW * dpr, 2400) / base.width });
      const off = document.createElement('canvas');
      off.width = Math.ceil(vp.width); off.height = Math.ceil(vp.height);
      if(renderTask){ try{ renderTask.cancel(); }catch(_){ } }
      renderTask = page.render({ canvasContext: off.getContext('2d'), viewport: vp });
      await renderTask.promise;
      if(token !== renderToken) return;
      canvas.width = off.width; canvas.height = off.height;
      canvas.getContext('2d').drawImage(off, 0, 0);
    }catch(_){ /* cancelled or unreadable page: leave the sheet as it is */ }
  }

  function refresh(rerender){
    if(!file.bytes) { updateSamples(); return; }
    const g = file.geoms[state.page - 1], total = file.geoms.length;
    const cssW = layout();
    drawOverlay();
    updateSamples();
    $('where').textContent = 'Page ' + state.page + ' of ' + total;
    $('btnPrev').disabled = state.page <= 1;
    $('btnNext').disabled = state.page >= total;
    $('dims').textContent = total + (total === 1 ? ' page, ' : ' pages, ') +
      Math.round(g.W / PT_PER_MM) + ' × ' + Math.round(g.H / PT_PER_MM) + ' mm';
    const ratio = Math.min(1.6, Math.max(.6, g.W / g.H));
    $('posPage').style.aspectRatio = String(ratio);
    if(rerender || Math.abs(cssW - lastCssW) > 1){ lastCssW = cssW; renderPage(cssW); }
  }

  function updateSamples(){
    const total = file.geoms.length || 12, n = file.bytes ? state.page : 1;
    const a = $('sampleA'), b = $('sampleB');
    a.textContent = String(n); b.textContent = n + '/' + total;
    [a, b].forEach(el => { el.className = 'big ' + FACES[state.face].cls; });
  }

  /* ---------- Writing the numbers ---------- */
  async function buildPdf(){
    const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
    const doc = await PDFDocument.load(file.bytes);
    const face = FACES[state.face];
    const font = await doc.embedFont(StandardFonts[face.std]);
    const pages = doc.getPages(), total = pages.length;
    const size = state.size, m = state.margin * PT_PER_MM;
    const row = state.pos[0], col = state.pos[1];

    pages.forEach((page, i) => {
      const g = geomOf(page), b = g.box;
      const text = label(i + 1, total);
      const tw = font.widthOfTextAtSize(text, size);
      /* vx, vy: start of the text baseline as seen on screen, from the bottom left */
      const vx = col === 'l' ? m : col === 'r' ? g.W - m - tw : (g.W - tw) / 2;
      const vy = row === 'b' ? m : g.H - m - face.digit * size;
      let x, y;
      if(g.rot === 90){ x = b.x + b.width - vy; y = b.y + vx; }
      else if(g.rot === 180){ x = b.x + b.width - vx; y = b.y + b.height - vy; }
      else if(g.rot === 270){ x = b.x + vy; y = b.y + b.height - vx; }
      else { x = b.x + vx; y = b.y + vy; }
      page.drawText(text, { x, y, size, font, color: rgb(0, 0, 0), rotate: degrees(g.rot) });
    });
    return doc.save();
  }

  async function saveFile(filename, bytes){
    const blob = new Blob([bytes], { type:'application/pdf' });
    const downloads = await downloadsReady;
    if(downloads){
      await downloads.save({ filename, data: blob });
      return;
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 15000);
  }

  async function download(){
    if(!file.bytes) return;
    const btn = $('btnDownload');
    const outName = file.name.replace(/\.pdf$/i, '') + '_numbered.pdf';
    btn.disabled = true;
    setStatus('Adding page numbers…');
    await new Promise(r => setTimeout(r, 30));

    let out;
    try{ out = await buildPdf(); }
    catch(_){
      setStatus('The numbers could not be added to this PDF. The file may use features this tool can\'t edit.', 'bad');
      btn.disabled = false; return;
    }
    try{
      await saveFile(outName, out);
      setStatus('Downloaded ' + outName, 'good');
    }catch(err){
      const code = err && err.code;
      if(code === 'declined') setStatus('Download cancelled. Nothing was saved.');
      else if(code === 'rate_limited') setStatus('A save prompt is already open. Answer it, then download again.', 'bad');
      else if(code === 'too_large') setStatus('This PDF is too large to save from here.', 'bad');
      else setStatus('Saving is not available in this view. Open the page in a browser tab and download again.', 'bad');
    }
    btn.disabled = false;
  }

  /* ---------- Controls ---------- */
  function bindGrid(id, key){
    $(id).addEventListener('click', e => {
      const b = e.target.closest('button.tool'); if(!b) return;
      $(id).querySelectorAll('.tool').forEach(x => {
        x.classList.toggle('active', x === b);
        x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
      });
      state[key] = b.dataset.val;
      refresh(false);
    });
  }
  bindGrid('fontGrid', 'face');
  bindGrid('formatGrid', 'format');

  $('sizeRange').addEventListener('input', e => {
    state.size = +e.target.value;
    $('sizeVal').textContent = state.size + ' pt';
    refresh(false);
  });
  $('marginRange').addEventListener('input', e => {
    state.margin = +e.target.value;
    $('marginVal').textContent = state.margin + ' mm';
    refresh(false);
  });

  $('posPage').addEventListener('click', e => {
    const b = e.target.closest('button[data-pos]'); if(!b) return;
    $('posPage').querySelectorAll('button').forEach(x => {
      x.classList.toggle('active', x === b);
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    state.pos = b.dataset.pos;
    $('posName').textContent = POS_NAMES[state.pos];
    refresh(false);
  });

  $('btnPrev').addEventListener('click', () => { if(state.page > 1){ state.page--; refresh(true); } });
  $('btnNext').addEventListener('click', () => { if(state.page < file.geoms.length){ state.page++; refresh(true); } });

  const input = $('file');
  $('btnChoose').addEventListener('click', () => input.click());
  $('btnAnother').addEventListener('click', () => input.click());
  input.addEventListener('change', () => { loadFile(input.files[0]); input.value = ''; });
  $('btnDownload').addEventListener('click', download);

  const stage = $('stage');
  let dragDepth = 0;
  stage.addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; stage.classList.add('over'); });
  stage.addEventListener('dragover', e => { e.preventDefault(); });
  stage.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if(!dragDepth) stage.classList.remove('over'); });
  stage.addEventListener('drop', e => {
    e.preventDefault(); dragDepth = 0; stage.classList.remove('over');
    const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) loadFile(f);
  });
  /* A PDF dropped outside the stage should not navigate away from the tool */
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    if(!file.bytes) return;
    layout(); drawOverlay();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => refresh(false), 160);
  });

  updateSamples();
})();
</script>
</body>
</html>
